<!--
  5AM Bakery — recipe request form
  Paste this into your GitHub Pages site where you want the form to appear,
  then change WORKER_URL below to your deployed Worker address
  (for example https://fiveam-recipes.your-subdomain.workers.dev).
-->

<section class="recipe-request">
  <h2>Request the recipe</h2>
  <p>Leave your name and email. If you are on the list the link arrives right away.</p>

  <form id="recipeRequestForm" novalidate>
    <label for="rrName">Name</label>
    <input id="rrName" name="name" type="text" autocomplete="name" required maxlength="80" placeholder="Your name">

    <label for="rrEmail">Email</label>
    <input id="rrEmail" name="email" type="email" autocomplete="email" required placeholder="you@example.com">

    <button id="rrSubmit" type="submit">Send me the recipe</button>
    <p id="rrMessage" role="status" aria-live="polite"></p>
  </form>
</section>

<style>
  .recipe-request { max-width: 440px; margin: 0 auto; padding: 28px; background: #fffdf9;
                    border: 1px solid #e8dfd0; border-radius: 16px; color: #2b2118;
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .recipe-request h2 { margin: 0 0 6px; font-size: 22px; }
  .recipe-request p { margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #8d7c69; }
  .recipe-request label { display: block; margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .recipe-request input { width: 100%; box-sizing: border-box; padding: 12px 14px; margin-bottom: 16px;
                          font-size: 15px; border: 1px solid #e8dfd0; border-radius: 9px; background: #fff; }
  .recipe-request button { width: 100%; padding: 13px 18px; font-size: 15px; font-weight: 600;
                           color: #fffdf9; background: #2b2118; border: 0; border-radius: 9px; cursor: pointer; }
  .recipe-request button:disabled { opacity: .6; cursor: default; }
  #rrMessage { display: none; margin: 16px 0 0; padding: 12px 14px; font-size: 14px; border-radius: 9px; }
  #rrMessage.ok { display: block; background: #eef6ee; color: #2f5d34; }
  #rrMessage.err { display: block; background: #fbeeee; color: #8a2f2f; }
</style>

<script>
(function () {
  var WORKER_URL = 'https://fiveam-recipes.YOUR-SUBDOMAIN.workers.dev';

  var form = document.getElementById('recipeRequestForm');
  var msg = document.getElementById('rrMessage');
  var btn = document.getElementById('rrSubmit');

  function show(kind, text) {
    msg.className = kind;
    msg.textContent = text;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var name = document.getElementById('rrName').value.trim();
    var email = document.getElementById('rrEmail').value.trim();
    if (!name || !email) { show('err', 'Please fill in both fields.'); return; }

    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
      var res = await fetch(WORKER_URL + '/api/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, email: email })
      });
      var data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'Something went wrong.');
      show('ok', data.message);
      form.reset();
    } catch (err) {
      show('err', err.message || 'Something went wrong. Please try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send me the recipe';
    }
  });
})();
</script>
